name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ runner.os }}-build-pip-${{ hashFiles('requirements.txt', 'requirements-gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-pip-

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt
          pip install pyinstaller==6.17.0

      - name: Build executable
        shell: bash
        run: |
          # ``anime_downloader`` is imported lazily from ``gui.py`` only when
          # the bundled binary is re-launched with ``--run-downloader``, so
          # PyInstaller's static analysis cannot see the import. Bundle it
          # explicitly as a hidden import so the in-process downloader mode
          # works on the user's machine.
          pyinstaller --noconfirm --onedir --windowed --hidden-import=anime_downloader --name AnimeUnityDownloader gui.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist-pkg
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows runners have no `zip` on PATH; use PowerShell instead.
            powershell -NoProfile -Command "Compress-Archive -Path dist/AnimeUnityDownloader -DestinationPath dist-pkg/AnimeUnityDownloader-windows.zip -Force"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp -R dist/AnimeUnityDownloader.app dist-pkg/
            (cd dist-pkg && zip -r AnimeUnityDownloader-macos.zip AnimeUnityDownloader.app)
          else
            (cd dist && zip -r ../dist-pkg/AnimeUnityDownloader-linux.zip AnimeUnityDownloader)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeUnityDownloader-${{ runner.os }}
          path: dist-pkg/*.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AnimeUnityDownloader-macOS/AnimeUnityDownloader-macos.zip
            artifacts/AnimeUnityDownloader-Windows/AnimeUnityDownloader-windows.zip
            artifacts/AnimeUnityDownloader-Linux/AnimeUnityDownloader-linux.zip
          generate_release_notes: true
